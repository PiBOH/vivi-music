name: Build Desktop (macOS)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      # Compile the native "Now Playing" helper (ViviMediaSession.m) into a
      # per-architecture dylib that is bundled as a classpath resource and
      # loaded at runtime via JNA (see MacMediaSession.kt). Each runner builds
      # for its own architecture, so only one arch needs to be present.
      - name: Build native media session helper
        shell: bash
        run: |
          set -euo pipefail
          ARCH_FLAG=""
          RES_DIR="desktop/src/main/resources/native/macos-${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH_FLAG="-arch arm64"
          else
            ARCH_FLAG="-arch x86_64"
          fi
          mkdir -p "$RES_DIR"
          # UserNotifications is required by the native notification API
          # (UNUserNotificationCenter) added in DE 1.50.17 for issue #7.
          xcrun -sdk macosx clang $ARCH_FLAG -O2 -fobjc-arc -dynamiclib \
            -Wl,-install_name,@rpath/libvivi_media.dylib \
            -framework Foundation -framework AppKit -framework MediaPlayer \
            -framework UserNotifications \
            -o "$RES_DIR/libvivi_media.dylib" desktop/native/ViviMediaSession.m
          file "$RES_DIR/libvivi_media.dylib"

      - name: Package desktop distribution
        shell: bash
        run: ./gradlew :desktop:packageDmg :desktop:packagePkg --no-daemon

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          MOBILE="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          DE="$(sed -n '4p' version.txt | tr -d '\r\n' | xargs)"
          VERSION="${MOBILE}_DE-${DE}"
          mkdir -p dist
          cp desktop/build/compose/binaries/main/dmg/*.dmg "dist/VIVIMusic-${VERSION}-${{ matrix.arch }}.dmg"
          cp desktop/build/compose/binaries/main/pkg/*.pkg "dist/VIVIMusic-${VERSION}-${{ matrix.arch }}.pkg"
          ls -la dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
