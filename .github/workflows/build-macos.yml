name: Build macOS

on:
  workflow_call:

jobs:
  build:
    name: Build macOS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: intel
          - os: macos-15
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      # JDK 17 is bundled into the installer (runtime floor macOS 10.15+).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Package desktop distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          for f in composeApp/build/compose/binaries/main/dmg/*.dmg; do
            base="$(basename "$f" .dmg)"
            cp "$f" "dist/${base}-${{ matrix.name }}.dmg"
          done
          ls -la dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
