name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Package desktop distribution
        shell: bash
        env:
          INNERTUBE_API_KEY: ${{ secrets.INNERTUBE_API_KEY }}
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon
      - name: Collect packages
        shell: bash
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/*.deb dist/
          find composeApp/build/compose/binaries/main -name '*.AppImage' -exec cp {} dist/ \;
          ls -la dist
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*
          if-no-files-found: error
