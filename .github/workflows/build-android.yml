name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ vivi-music-de, main, beta ]
    tags-ignore: [ '**' ]

permissions:
  contents: read

jobs:
  build:
    name: Android APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same release signal as the desktop autorelease: manual dispatch, or a
    # push whose commit message starts with "v". GMS and FOSS build in
    # parallel; each job produces the fixed-name APK the release expects.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    strategy:
      fail-fast: false
      matrix:
        flavor: [ gms, foss ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Decode release keystore
        shell: bash
        run: |
          mkdir -p app/keystore
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore/release.keystore
          else
            echo "No KEYSTORE secret — release builds will fall back to the debug signing config."
          fi

      - name: Restore persistent debug keystore
        shell: bash
        run: |
          # The release signing config falls back to the debug keystore when the
          # real one is missing, so the runner needs a valid ~/.android/debug.keystore
          # or :app:validateSigning<Flavor>Release fails.
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > ~/.android/debug.keystore
            echo "Using persistent debug keystore from DEBUG_KEYSTORE secret"
          else
            echo "DEBUG_KEYSTORE secret not set — generating a fresh debug keystore"
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build ${{ matrix.flavor }} release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # The About screen shows NIGHTLY/STABLE from BuildConfig.IS_NIGHTLY,
          # driven by the mobile channel in version.txt (line 3).
          MOBILE_CHANNEL="$(sed -n '3p' version.txt | tr -d '[:space:]' | xargs | tr '[:upper:]' '[:lower:]')"
          NIGHTLY_FLAG=""
          if [[ -n "$MOBILE_CHANNEL" && "$MOBILE_CHANNEL" != "stable" ]]; then
            NIGHTLY_FLAG="-Pnightly=true"
          fi
          ./gradlew assembleUniversal${{ matrix.flavor == 'gms' && 'Gms' || 'Foss' }}Release $NIGHTLY_FLAG \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_DIR="app/build/outputs/apk/universal${{ matrix.flavor == 'gms' && 'Gms' || 'Foss' }}/release"
          APK="$(find "$APK_DIR" -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No APK produced in $APK_DIR" >&2
            exit 1
          fi
          cp "$APK" "dist/vivi-${{ matrix.flavor }}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.flavor }}
          path: dist/vivi-${{ matrix.flavor }}.apk
          if-no-files-found: error