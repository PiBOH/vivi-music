name: Build Android APK

# Manual-only by design: the APK is no longer published in any release (neither
# in the desktop releases nor anywhere else). A run builds the GMS and FOSS APKs
# in parallel and publishes them to `.releases/apk/latest` on the dedicated
# `apk-latest` branch: a one-commit branch that is force-replaced on every run,
# so it stays a stable download path without growing the repository history.
# Those two files (plus `version.json`) are what the website, the desktop
# Devices screen and the mobile updater download.

on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: "Keystore to sign with (auto = RELEASE_KEYSTORE if set, else DEBUG_KEYSTORE)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Android APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GMS and FOSS build in parallel; each job produces one of the two
    # fixed-name APKs the publish job below uploads.
    strategy:
      fail-fast: false
      matrix:
        flavor: [ gms, foss ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      # Signing key resolution: manual runs pick explicitly (release/debug);
      # everything else defaults to auto — release when the RELEASE_KEYSTORE
      # secret exists, otherwise the debug keystore (DEBUG_KEYSTORE).
      - name: Resolve signing key
        id: signing
        shell: bash
        run: |
          REQUESTED="${{ github.event.inputs.signing_key }}"
          if [ -z "$REQUESTED" ]; then REQUESTED="auto"; fi
          HAS_RELEASE="${{ secrets.RELEASE_KEYSTORE != '' }}"
          case "$REQUESTED" in
            release)
              if [ "$HAS_RELEASE" != "true" ]; then
                echo "::error::signing_key=release was requested but the RELEASE_KEYSTORE secret is not set." >&2
                exit 1
              fi
              echo "key=release" >> "$GITHUB_OUTPUT"
              ;;
            debug)
              echo "key=debug" >> "$GITHUB_OUTPUT"
              ;;
            auto)
              if [ "$HAS_RELEASE" = "true" ]; then
                echo "key=release" >> "$GITHUB_OUTPUT"
              else
                echo "key=debug" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::Unknown signing_key value: $REQUESTED" >&2
              exit 1
              ;;
          esac

      - name: Decode release keystore
        if: steps.signing.outputs.key == 'release'
        shell: bash
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/keystore/release.keystore
          echo "Release keystore restored from RELEASE_KEYSTORE secret"

      # Always restore a valid debug keystore: when the release key is absent
      # the release signing config falls back to the debug keystore, so the
      # runner needs ~/.android/debug.keystore or :app:validateSigning<Flavor>Release
      # fails.
      - name: Restore debug keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > ~/.android/debug.keystore
            echo "Using persistent debug keystore from DEBUG_KEYSTORE secret"
          else
            echo "DEBUG_KEYSTORE secret not set — generating a fresh debug keystore"
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build ${{ matrix.flavor }} release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # The About screen shows NIGHTLY/STABLE from BuildConfig.IS_NIGHTLY,
          # driven by the mobile channel in version.txt (line 3).
          MOBILE_CHANNEL="$(sed -n '3p' version.txt | tr -d '[:space:]' | xargs | tr '[:upper:]' '[:lower:]')"
          NIGHTLY_FLAG=""
          if [[ -n "$MOBILE_CHANNEL" && "$MOBILE_CHANNEL" != "stable" ]]; then
            NIGHTLY_FLAG="-Pnightly=true"
          fi
          # The About label (BuildConfig.RELEASE_CHANNEL) mirrors version.txt's
          # mobile channel so a fork build reads ALPHA instead of NIGHTLY.
          ./gradlew assembleUniversal${{ matrix.flavor == 'gms' && 'Gms' || 'Foss' }}Release $NIGHTLY_FLAG -Pchannel="$MOBILE_CHANNEL" \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_DIR="app/build/outputs/apk/universal${{ matrix.flavor == 'gms' && 'Gms' || 'Foss' }}/release"
          APK="$(find "$APK_DIR" -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No APK produced in $APK_DIR" >&2
            exit 1
          fi
          cp "$APK" "dist/vivi-${{ matrix.flavor }}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.flavor }}
          path: dist/vivi-${{ matrix.flavor }}.apk
          if-no-files-found: error

  # Makes the two APKs reachable at a fixed URL, which is what every download
  # link in the project points at:
  #   https://raw.githubusercontent.com/<owner>/<repo>/apk-latest/.releases/apk/latest/vivi-gsm.apk
  # (and `vivi-foss.apk` / `version.json`). The branch is recreated from
  # scratch and force-pushed, so only the latest build is ever there.
  publish:
    name: Publish APKs (.releases/apk/latest)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for version.txt + the commit subject)
        uses: actions/checkout@v4

      - name: Download both APKs
        uses: actions/download-artifact@v4
        with:
          path: apk
          merge-multiple: true

      - name: Flatten the downloaded APKs
        shell: bash
        run: |
          set -euo pipefail
          # `upload-artifact` decides the artifact's internal root on its own
          # (the common ancestor of the uploaded paths), so a single-file
          # upload is not guaranteed to land at the artifact root: the publish
          # step assumed `apk/vivi-<flavor>.apk` and aborted with
          # "apk/vivi-gsm.apk is missing - not publishing a partial build"
          # even though both APKs had built and been downloaded. Locate them
          # wherever they landed and normalise the layout the rest of the job
          # expects, so the step cannot depend on that detail again.
          mkdir -p apk-flat
          for flavor in gsm foss; do
            file="$(find apk -type f -name "vivi-$flavor.apk" -print -quit)"
            if [ -z "$file" ]; then
              echo "::error::apk/vivi-$flavor.apk is missing - not publishing a partial build" >&2
              exit 1
            fi
            cp "$file" "apk-flat/vivi-$flavor.apk"
          done
          ls -la apk-flat

      - name: Publish to the apk-latest branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # version.txt: line 1 = mobile version, line 2 = mobile version code,
          # line 3 = mobile channel (drives the About label too).
          VERSION="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          VERSION_CODE="$(sed -n '2p' version.txt | tr -d '\r\n' | xargs)"
          CHANNEL="$(sed -n '3p' version.txt | tr -d '\r\n' | xargs)"
          TITLE="$(git log -1 --pretty=%s)"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk-latest/.releases/apk/latest"
          rm -rf assets && mkdir assets && cd assets
          git init -q -b apk-latest
          mkdir -p .releases/apk/latest
          # Verified (and flattened) by the previous step.
          cp ../apk-flat/vivi-gsm.apk .releases/apk/latest/vivi-gsm.apk
          cp ../apk-flat/vivi-foss.apk .releases/apk/latest/vivi-foss.apk
          # version.json is what the updaters read: version + version code +
          # when it was built, with the exact URLs and sizes of both files.
          VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" CHANNEL="$CHANNEL" TITLE="$TITLE" BASE="$BASE" \
            python3 - <<'PY'
          import datetime, json, os

          base = os.environ["BASE"]
          files = [
              {
                  "name": name,
                  "sizeBytes": os.path.getsize(os.path.join(".releases/apk/latest", name)),
                  "url": f"{base}/{name}",
              }
              for name in ("vivi-gsm.apk", "vivi-foss.apk")
          ]
          doc = {
              "version": os.environ["VERSION"],
              "versionCode": int(os.environ.get("VERSION_CODE") or 0),
              "channel": os.environ["CHANNEL"],
              "title": os.environ["TITLE"],
              "builtAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "commit": os.environ["GITHUB_SHA"],
              "files": files,
          }
          with open(".releases/apk/latest/version.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "build(apk): $VERSION ($CHANNEL)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-latest
          ls -la .releases/apk/latest
          echo "Published $VERSION to $BASE (apk-latest branch)"
