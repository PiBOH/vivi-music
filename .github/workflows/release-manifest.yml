name: Release Manifest

# Keeps .websitede/releases.json and .websitede/changelog.json in sync with the
# published releases. The website reads those files instead of calling the
# public GitHub API, which allows only 60 unauthenticated requests per hour per
# IP: once that quota is spent every visitor behind that IP saw an empty download
# dialog / downloads page (the assets only came back with a manual refresh, and
# often not even then). An authenticated request has a 5000/hour quota, so the
# site never depends on the anonymous one again.
#
# Triggered by a push that changes version.txt (every release bumps it), once
# an hour, and manually. The hourly run exists because the push above fires the
# moment version.txt changes — i.e. minutes BEFORE the release workflow has
# uploaded its assets — so the manifest it built described a release whose files
# did not exist yet, and the download dialog/downloads page stayed incomplete
# (and needed a manual page refresh) until the next release bumped version.txt.
#
# A schedule is safe here because the repository's DEFAULT branch is
# `vivi-music-de`, not the upstream `main` mirror: a scheduled run executes the
# version of this file that lives on the default branch — this one — and commits
# back to it. The explicit `ref` on the checkout below keeps that true even if
# the default branch ever changes.

on:
  schedule:
    - cron: '0 * * * *'  # every hour, at :00 CEST (UTC+2 in summer)
  push:
    paths:
      - version.txt
      - .github/workflows/release-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-manifest
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always refresh the manifest on the DE branch, whatever the default
          # branch happens to be.
          ref: vivi-music-de

      - name: Fetch every release (authenticated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/PiBOH/vivi-music/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/PiBOH/vivi-music" > "$RUNNER_TEMP/repo.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/releases.json");console.log("pages:",Array.isArray(a[0])?a.length:1)' || true

      - name: Build the manifest
        run: |
          node scripts/build_release_manifest.js \
            "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/repo.json" \
            .websitede/releases.json .websitede/changelog.json

      - name: Commit when it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- .websitede/releases.json .websitede/changelog.json; then
            echo "manifest already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .websitede/releases.json .websitede/changelog.json
          git commit -m "chore(website): refresh the static release manifest"
          git push
