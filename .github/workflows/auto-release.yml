name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use version.txt)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  # Builds are delegated to the per-OS reusable workflows below. This workflow
  # only collects their artifacts and publishes the release.
  build-windows:
    name: Windows build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    uses: ./.github/workflows/build-windows-custom.yml
    secrets: inherit

  build-linux:
    name: Linux build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  build-macos:
    name: macOS build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    runs-on: ubuntu-latest
    # Creating the release + uploading assets requires write access to repo
    # contents. Declared at the job level too, so the permission survives even
    # if the workflow-level `permissions` block is edited or the job is moved.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$VERSION_INPUT" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="$(cat version.txt | tr -d '\r\n' | xargs)"
          fi
          VERSION="${VERSION#v}"
          VERSION="${VERSION// /-}"
          if [[ "$VERSION" =~ -(alpha|beta|rc|pre)([.-]?[0-9]+)?$ ]]; then
            PRERELEASE=true
            CHANNEL="pre-release"
          else
            PRERELEASE=false
            CHANNEL="stable"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Vivi Music DE $VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (prerelease: $PRERELEASE)"
      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SECTION=""
          if [[ -f CHANGELOG.md ]]; then
            SECTION="$(awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; print; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)"
          fi
          if [[ -z "$SECTION" ]]; then
            SECTION="*No changelog entry found for version $VERSION.*"
          fi
          {
            echo "section<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Collect commits
        id: commits
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS="$(git log "$PREV_TAG..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null || true)"
          else
            COMMITS="$(git log --pretty=format:'- %s' --no-merges 2>/dev/null || true)"
          fi
          if [[ -z "$COMMITS" ]]; then
            COMMITS="- Initial release"
          fi
          {
            echo "commits<<COMMITS_EOF"
            echo "$COMMITS"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            ## Vivi Music DE ${{ steps.version.outputs.version }}
            **Release channel:** `${{ steps.version.outputs.channel }}`

            ${{ steps.changelog.outputs.section }}

            ### Commits
            ${{ steps.commits.outputs.commits }}

            ---
            This release was built automatically from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
