name: Auto Release (Desktop)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use version.txt)'
        required: false
        type: string
        default: ''
  push:
    branches: [ vivi-music-de, main, beta ]
    tags-ignore: [ '**' ]

permissions:
  contents: write
  actions: write

jobs:
  # Builds are delegated to the per-OS reusable workflows. This workflow only
  # collects their artifacts and publishes the release. They run on manual
  # dispatch, or on push when the commit message starts with "v" (our release
  # signal), mirroring the old vivi-music-de release pipeline.
  build-windows:
    name: Windows
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    uses: ./.github/workflows/build-desktop-windows.yml
    secrets: inherit

  build-linux:
    name: Linux
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    uses: ./.github/workflows/build-desktop-linux.yml
    secrets: inherit

  build-macos:
    name: macOS
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    uses: ./.github/workflows/build-desktop-macos.yml
    secrets: inherit

  # The Android APKs are not built here and never ship with this release: this
  # job only *starts* `Build Android APK`, which publishes the GMS/FOSS APKs to
  # `.releases/apk/latest` on the dedicated `apk-latest` branch — the one
  # download path the site, the desktop Devices screen and the mobile updater
  # use.
  #
  # A dispatch on purpose, not a `uses:`: a called workflow is awaited by its
  # caller, so a slow runner or a broken Android build would hold the desktop
  # release back, and the release must not depend on the APK at all. It also
  # never reads the APKs back from that run (nothing here downloads its
  # artifacts): the branch is the only place they live.
  start-apk-build:
    name: Start the Android APK build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Build Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-android.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  release:
    name: Publish GitHub Release
    needs: [ build-windows, build-linux, build-macos ]
    # Desktop releases carry the desktop installers only; the APK is no longer
    # a release asset of any kind.
    if: ${{ always() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # version.txt: line 1 = mobile version, line 4 = DE version, line 6 = DE channel.
          MOBILE_VERSION="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          DE_VERSION="$(sed -n '4p' version.txt | tr -d '\r\n' | xargs)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$VERSION_INPUT" ]]; then
            FULL_VERSION="$VERSION_INPUT"
          else
            FULL_VERSION="${MOBILE_VERSION}_DE-${DE_VERSION}"
          fi
          FULL_VERSION="${FULL_VERSION#v}"
          FULL_VERSION="${FULL_VERSION// /-}"
          # Channel: "stable" (or empty) => stable release, anything else => pre-release.
          CHANNEL="$(sed -n '6p' version.txt | tr -d '\r\n' | xargs | tr '[:upper:]' '[:lower:]')"
          if [[ "$CHANNEL" == "stable" || -z "$CHANNEL" ]]; then
            PRERELEASE=false
            CHANNEL="stable"
          else
            PRERELEASE=true
          fi
          # Tags carry NO "v" prefix. Stable releases use the bare version;
          # non-stable releases append the channel (e.g. 6.0.5_DE-1.0.0-nightly).
          if [[ "$CHANNEL" == "stable" ]]; then
            TAG="$FULL_VERSION"
          else
            TAG="$FULL_VERSION-$CHANNEL"
          fi
          # Release display name: "Vivi Music <mobile>_DE <de_version>"
          # (e.g. "Vivi Music 6.4.3_DE 1.33.6" — no "v" prefix, no hyphen after DE).
          TITLE_VERSION="${FULL_VERSION//_DE-/_DE }"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "de_version=$DE_VERSION" >> "$GITHUB_OUTPUT"
          echo "title_version=$TITLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=Vivi Music $TITLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $FULL_VERSION (title: Vivi Music $TITLE_VERSION, tag: $TAG, channel: $CHANNEL, prerelease: $PRERELEASE)"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DE_VERSION="${{ steps.version.outputs.de_version }}"
          SECTION=""
          if [[ -f CHANGELOG.md ]]; then
            for v in "$VERSION" "$DE_VERSION"; do
              [[ -z "$v" ]] && continue
              SECTION="$(awk -v v="$v" '
                # Match the exact version, with an optional channel suffix
                # (e.g. -nightly), before the closing bracket.
                index($0, "## [" v "]") == 1 || index($0, "## [" v "-") == 1 { found = 1; print; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md)"
              [[ -n "$SECTION" ]] && break
            done
          fi
          if [[ -z "$SECTION" ]]; then
            SECTION="*No changelog entry found for version $VERSION.*"
          fi
          # Never surface the website bookkeeping commits (an older entry may
          # still carry them in its `### Commits` list).
          SECTION="$(printf '%s\n' "$SECTION" | grep -v -F -- '- chore(website): refresh the static release manifest' || true)"
          {
            echo "section<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect commits
        id: commits
        shell: bash
        run: |
          set -euo pipefail
          # The hourly website bookkeeping commit is not part of a release and
          # only made the list longer, so it is never shown in the notes. A
          # literal (grep -F) match on the subject: no regex escaping, no
          # anchors, so a trailing CR in the line does not defeat it.
          IGNORED='- chore(website): refresh the static release manifest'
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS="$(git log "$PREV_TAG..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null | grep -v -F -- "$IGNORED" || true)"
          else
            COMMITS="$(git log --pretty=format:'- %s' --no-merges 2>/dev/null | grep -v -F -- "$IGNORED" || true)"
          fi
          if [[ -z "$COMMITS" ]]; then
            COMMITS="- Initial release"
          fi
          # If there are many commits, collapse the whole list into an
          # expandable <details> block (a "cascading menu") so the release body
          # stays readable.
          COMMIT_COUNT="$(printf '%s\n' "$COMMITS" | grep -c . || true)"
          if [[ "$COMMIT_COUNT" -gt 7 ]]; then
            COMMITS="$(printf '<details>\n<summary>Show all %s commits</summary>\n\n%s\n</details>' "$COMMIT_COUNT" "$COMMITS")"
          fi
          {
            echo "commits<<COMMITS_EOF"
            echo "$COMMITS"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate AUR packaging assets
        shell: bash
        run: |
          set -euo pipefail
          # PKGBUILD + SRCINFO + the uninstall hook for Arch users (AUR), pinned
          # to this exact commit so the source checksum is stable and matches
          # the release. They ship as ONE archive, not as three loose files: an
          # `.install` sitting in the asset list is noise (and the bot had to
          # filter it out), while makepkg needs the hook file next to the
          # PKGBUILD anyway to honour `install=`, so the three files have to
          # travel together.
          AUR_DIR="$(mktemp -d)"
          python3 scripts/generate_aur_pkgbuild.py --out "$AUR_DIR" --sha "${{ github.sha }}"
          tar -czf "artifacts/VIVIMusic-${{ steps.version.outputs.version }}-AUR.tar.gz" -C "$AUR_DIR" .
          rm -rf "$AUR_DIR"
          # The install guide ships with every release.
          cp INSTALL-GUIDE.md artifacts/
          ls -la artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            ## Vivi Music ${{ steps.version.outputs.title_version }}
            **Release channel:** `${{ steps.version.outputs.channel }}`

            ${{ steps.changelog.outputs.section }}

            ### Commits
            ${{ steps.commits.outputs.commits }}
            ---
            This release was built automatically from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

